<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>决策日志</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-gray-400 hover:text-white text-sm transition-colors">← 主题仪表板</a>
      <span class="text-gray-700">|</span>
      <h1 class="text-xl font-semibold tracking-tight">决策日志</h1>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="showForm()" class="text-xs px-3 py-1.5 rounded-full bg-green-700 hover:bg-green-600 text-white transition-colors font-medium">
        + 新建记录
      </button>
      <button onclick="exportJSON()" class="text-xs px-3 py-1 rounded-full border border-gray-600 text-gray-400 hover:text-white transition-colors">
        导出
      </button>
    </div>
  </header>

  <!-- Entry form (hidden by default) -->
  <div id="form-overlay" class="hidden fixed inset-0 bg-black/60 z-40 flex items-start justify-center pt-16 px-4 pb-8 overflow-y-auto">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-2xl p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h2 id="form-title" class="font-semibold text-base">新建记录</h2>
        <button onclick="hideForm()" class="text-gray-500 hover:text-white text-xl leading-none">×</button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-gray-400 mb-1 block">日期</label>
          <input id="f-date" type="date" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-gray-500" />
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-1 block">类型</label>
          <select id="f-type" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-gray-500">
            <option value="framework">框架 / 认知</option>
            <option value="theme">主题研究</option>
            <option value="stock">个股决策</option>
            <option value="review">阶段回顾</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs text-gray-400 mb-1 block">标题</label>
        <input id="f-title" type="text" placeholder="一句话概括这次决策" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:border-gray-500" />
      </div>

      <div>
        <label class="text-xs text-gray-400 mb-1 block">内容 / Thesis</label>
        <textarea id="f-content" rows="5" placeholder="为什么做这个决定？核心逻辑是什么？" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:border-gray-500 resize-y"></textarea>
      </div>

      <div>
        <label class="text-xs text-gray-400 mb-1 block">关键假设 <span class="text-gray-600">（这个判断成立，需要哪些事是真的）</span></label>
        <textarea id="f-assumptions" rows="3" placeholder="假设 1：...&#10;假设 2：..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:border-gray-500 resize-y"></textarea>
      </div>

      <div>
        <label class="text-xs text-gray-400 mb-1 block">会让我改变判断的情况 <span class="text-gray-600">（什么信号说明我错了）</span></label>
        <textarea id="f-exit" rows="2" placeholder="如果发生 X，说明假设 N 被证伪，我会重新评估..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:border-gray-500 resize-y"></textarea>
      </div>

      <div>
        <label class="text-xs text-gray-400 mb-1 block">关联标的 / 主题 <span class="text-gray-600">（可选）</span></label>
        <input id="f-tags" type="text" placeholder="例：IONQ, 量子计算主题" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:border-gray-500" />
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button onclick="hideForm()" class="text-sm px-4 py-2 rounded-lg border border-gray-700 text-gray-400 hover:text-white transition-colors">取消</button>
        <button onclick="saveEntry()" class="text-sm px-5 py-2 rounded-lg bg-green-700 hover:bg-green-600 text-white font-medium transition-colors">保存</button>
      </div>
    </div>
  </div>

  <main class="max-w-3xl mx-auto px-4 py-8 space-y-4">

    <!-- Filter bar -->
    <div class="flex items-center gap-3 flex-wrap">
      <span class="text-xs text-gray-500">筛选：</span>
      <button onclick="filterType('')"     id="filter-all"       class="filter-btn active text-xs px-3 py-1 rounded-full border">全部</button>
      <button onclick="filterType('framework')" id="filter-framework" class="filter-btn text-xs px-3 py-1 rounded-full border">框架</button>
      <button onclick="filterType('theme')"     id="filter-theme"     class="filter-btn text-xs px-3 py-1 rounded-full border">主题研究</button>
      <button onclick="filterType('stock')"     id="filter-stock"     class="filter-btn text-xs px-3 py-1 rounded-full border">个股决策</button>
      <button onclick="filterType('review')"    id="filter-review"    class="filter-btn text-xs px-3 py-1 rounded-full border">阶段回顾</button>
      <span id="entry-count" class="text-xs text-gray-600 ml-auto"></span>
    </div>

    <!-- Entries list -->
    <div id="entries-list" class="space-y-4"></div>

    <p id="empty-state" class="hidden text-center py-16 text-gray-600">暂无记录，点击「新建记录」开始。</p>

  </main>

  <style>
    .filter-btn { border-color: #374151; color: #6b7280; transition: all 0.15s; }
    .filter-btn:hover { border-color: #6b7280; color: #d1d5db; }
    .filter-btn.active { border-color: #34d399; color: #34d399; background: rgba(52,211,153,0.08); }
  </style>

  <script>
    const TYPE_META = {
      framework: { label: "框架 / 认知", color: "bg-purple-900 text-purple-300" },
      theme:     { label: "主题研究",    color: "bg-blue-900 text-blue-300" },
      stock:     { label: "个股决策",    color: "bg-emerald-900 text-emerald-300" },
      review:    { label: "阶段回顾",    color: "bg-yellow-900 text-yellow-300" },
    };

    const STORAGE_KEY = "investment_journal_v1";

    // ── Entry #0: framework establishment ────────────────────────────────────
    const ENTRY_ZERO = {
      id: 0,
      date: "2026-05-10",
      type: "framework",
      title: "个人投资框架 v1.0",
      content: `通过一段时间的思考，建立以下个人投资框架：

主体仓位（70-80%）
→ 低费率指数基金，长期持有，不操作
→ 稳定获取市场增长红利，跑赢大多数主动管理产品

学习仓位（20-30%）
→ Mini 仓位，在自己有认知优势的领域集中押注
→ 目标不是跑赢机构，而是建立判断力和反馈机制

Dashboard 的定位：漏斗的第一层
→ 发现值得研究的 Early Discovery 主题
→ 后续研究要刻意绕开二手金融分析，找原始信息
→ 只在自己真正懂的领域出手，其他方向只看不动

个人投资者真实的结构性优势：
1. 时间套利：无赎回压力，可以持有穿越机构被迫卖出的低谷
2. 行为纪律：不追涨杀跌，避免大多数人犯的错误
3. 领域认知：在自己的行业里，判断比泛化分析师更准`,
      assumptions: `1. 在我有积累的领域，我的一手判断比通用分析师准确
2. 持有 1-3 年的耐心是可以做到的，不会被短期波动影响
3. Mini 仓位带来的真实心理压力，能让我识别自己的行为模式
4. 6-12 个月的实践 + 日志回顾，能发现自己在哪类判断上准/不准`,
      exit: `1. 如果日志回顾发现，在"熟悉领域"的判断也接近随机（成立率 < 55%），重新评估主动投资的比例
2. 如果发现自己持续违反预设的离场条件（情绪覆盖规则），减少学习仓位
3. 如果指数基金表现长期远超学习仓位，考虑将学习仓位并入指数`,
      tags: "投资框架, 决策日志, 工具体系",
      created_at: new Date().toISOString(),
    };

    // ── Storage ───────────────────────────────────────────────────────────────
    function loadEntries() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      // First time: seed with entry #0
      const initial = { entries: [ENTRY_ZERO], next_id: 1 };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
      return initial;
    }

    function saveEntries(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ── Render ────────────────────────────────────────────────────────────────
    let _activeFilter = "";
    let _editingId = null;

    function render() {
      const data = loadEntries();
      let entries = [...data.entries].sort((a, b) => b.id - a.id);
      if (_activeFilter) entries = entries.filter(e => e.type === _activeFilter);

      const list = document.getElementById("entries-list");
      const empty = document.getElementById("empty-state");
      document.getElementById("entry-count").textContent = `共 ${data.entries.length} 条`;

      if (!entries.length) {
        list.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");

      list.innerHTML = entries.map(e => {
        const meta = TYPE_META[e.type] || { label: e.type, color: "bg-gray-800 text-gray-400" };
        const sections = [
          { label: "内容 / Thesis", value: e.content },
          { label: "关键假设", value: e.assumptions },
          { label: "改变判断的条件", value: e.exit },
        ].filter(s => s.value && s.value.trim());

        return `
        <article class="bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-3 group">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-gray-600 text-xs font-mono">#${e.id}</span>
              <span class="text-xs px-2 py-0.5 rounded-full ${meta.color}">${meta.label}</span>
              <span class="text-gray-500 text-xs">${e.date}</span>
              ${e.tags ? `<span class="text-gray-600 text-xs">${e.tags}</span>` : ""}
            </div>
            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
              <button onclick="editEntry(${e.id})" class="text-xs text-gray-500 hover:text-gray-200">编辑</button>
              <button onclick="deleteEntry(${e.id})" class="text-xs text-gray-600 hover:text-red-400">删除</button>
            </div>
          </div>

          <h3 class="font-semibold text-base">${e.title}</h3>

          ${sections.map(s => `
            <div>
              <p class="text-xs text-gray-500 mb-1">${s.label}</p>
              <p class="text-sm text-gray-300 leading-relaxed whitespace-pre-line">${s.value}</p>
            </div>
          `).join("")}
        </article>`;
      }).join("");
    }

    // ── Filter ────────────────────────────────────────────────────────────────
    function filterType(type) {
      _activeFilter = type;
      document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById(`filter-${type || "all"}`).classList.add("active");
      render();
    }

    // ── Form ──────────────────────────────────────────────────────────────────
    function showForm(entry = null) {
      _editingId = entry ? entry.id : null;
      document.getElementById("form-title").textContent = entry ? "编辑记录" : "新建记录";
      document.getElementById("f-date").value     = entry ? entry.date        : new Date().toISOString().slice(0, 10);
      document.getElementById("f-type").value     = entry ? entry.type        : "framework";
      document.getElementById("f-title").value    = entry ? entry.title       : "";
      document.getElementById("f-content").value  = entry ? entry.content     : "";
      document.getElementById("f-assumptions").value = entry ? entry.assumptions : "";
      document.getElementById("f-exit").value     = entry ? entry.exit        : "";
      document.getElementById("f-tags").value     = entry ? entry.tags        : "";
      document.getElementById("form-overlay").classList.remove("hidden");
    }

    function hideForm() {
      document.getElementById("form-overlay").classList.add("hidden");
      _editingId = null;
    }

    function saveEntry() {
      const title = document.getElementById("f-title").value.trim();
      if (!title) { alert("请填写标题"); return; }

      const data = loadEntries();
      const entry = {
        id:          _editingId !== null ? _editingId : data.next_id,
        date:        document.getElementById("f-date").value,
        type:        document.getElementById("f-type").value,
        title,
        content:     document.getElementById("f-content").value.trim(),
        assumptions: document.getElementById("f-assumptions").value.trim(),
        exit:        document.getElementById("f-exit").value.trim(),
        tags:        document.getElementById("f-tags").value.trim(),
        created_at:  _editingId !== null
                       ? (data.entries.find(e => e.id === _editingId)?.created_at || new Date().toISOString())
                       : new Date().toISOString(),
      };

      if (_editingId !== null) {
        const idx = data.entries.findIndex(e => e.id === _editingId);
        if (idx >= 0) data.entries[idx] = entry;
      } else {
        data.entries.push(entry);
        data.next_id = (data.next_id || 1) + 1;
      }

      saveEntries(data);
      hideForm();
      render();
    }

    function editEntry(id) {
      const data = loadEntries();
      const entry = data.entries.find(e => e.id === id);
      if (entry) showForm(entry);
    }

    function deleteEntry(id) {
      if (!confirm("确认删除这条记录？")) return;
      const data = loadEntries();
      data.entries = data.entries.filter(e => e.id !== id);
      saveEntries(data);
      render();
    }

    // ── Export ────────────────────────────────────────────────────────────────
    function exportJSON() {
      const data = loadEntries();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `investment_journal_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    // Close overlay on background click
    document.getElementById("form-overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("form-overlay")) hideForm();
    });

    render();
  </script>
</body>
</html>
