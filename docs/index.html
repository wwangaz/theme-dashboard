<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主题发现仪表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between gap-4">
    <h1 class="text-xl font-semibold tracking-tight" data-i18n="title">主题发现仪表板</h1>
    <div class="flex items-center gap-4">
      <a href="journal.html" class="text-xs text-gray-400 hover:text-white border border-gray-700 hover:border-gray-500 px-3 py-1 rounded-full transition-colors">决策日志</a>
      <a href="portfolio.html" class="text-xs text-gray-400 hover:text-white border border-gray-700 hover:border-gray-500 px-3 py-1 rounded-full transition-colors" data-i18n="portfolio_link">纸仓</a>
      <span id="last-updated" class="text-sm text-gray-400"></span>
      <button id="lang-toggle"
        class="text-xs px-3 py-1 rounded-full border border-gray-600 text-gray-300 hover:border-gray-400 hover:text-white transition-colors">
        EN
      </button>
    </div>
  </header>

  <!-- Macro context bar -->
  <div id="macro-bar" class="hidden border-b border-gray-800 bg-gray-900 px-6 py-2.5 flex flex-wrap items-center gap-6 text-sm">
    <span class="text-gray-500 text-xs uppercase tracking-wide" data-i18n="macro_label">宏观利率</span>
    <span id="yield-2y" class="font-mono text-gray-300"></span>
<span id="yield-10y" class="font-mono text-gray-300"></span>
    <span id="spread-2-10" class="font-mono text-gray-400 text-xs cursor-help" data-tip-yield></span>
    <span id="risk-label" class="text-xs px-2 py-0.5 rounded-full cursor-help" data-tip-yield></span>
  </div>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-10">

    <section id="section-high">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-lg">🔥</span>
        <h2 class="text-lg font-semibold" data-i18n="high_conviction">高确信度</h2>
        <span class="text-sm text-gray-400" data-i18n="score_7_10">评分 7–10</span>
      </div>
      <div id="grid-high" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>

    <section id="section-emerging">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-lg">🌱</span>
        <h2 class="text-lg font-semibold" data-i18n="emerging">新兴主题</h2>
        <span class="text-sm text-gray-400" data-i18n="score_4_6">评分 4–6</span>
      </div>
      <div id="grid-emerging" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>

    <section id="section-watch">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-lg">⚠️</span>
        <h2 class="text-lg font-semibold" data-i18n="watch">观察 / 衰退</h2>
        <span class="text-sm text-gray-400" data-i18n="score_1_3">评分 1–3</span>
      </div>
      <div id="grid-watch" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>

    <div id="empty-state" class="hidden text-center py-20 text-gray-500">
      <p class="text-4xl mb-4">📭</p>
      <p data-i18n="no_themes">暂无主题数据，流水线将在今晚运行。</p>
    </div>
  </main>

  <script>
    // ── i18n ──────────────────────────────────────────────────────────────────
    const I18N = {
      zh: {
        title: "主题发现仪表板",
        updated: (dt) => `更新于 ${dt.toLocaleDateString("zh-CN", {month:"short",day:"numeric"})} ${dt.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}`,
        macro_label: "宏观利率",
        portfolio_link: "纸仓",
        high_conviction: "高确信度", score_7_10: "评分 7–10",
        emerging: "新兴主题", score_4_6: "评分 4–6",
        watch: "观察 / 衰退", score_1_3: "评分 1–3",
        no_themes: "暂无主题数据，流水线将在今晚运行。",
        none_today: "今日暂无。",
        bullish: "看多", bearish: "看空", neutral: "中性",
        spread: (v) => `2Y-10Y 息差 ${v > 0 ? "+" : ""}${(v*100).toFixed(0)}bp`,
        risk: { rising_rates_pressure: "利率上行，成长承压", rates_easing: "利率走低", rates_stable: "利率平稳", yield_curve_inverted: "收益率曲线倒挂" },
        stage: {
          "Early Discovery": "早期发现", "Acceleration": "加速阶段",
          "Momentum Expansion": "动量扩展", "Crowded Euphoria": "拥挤狂热", "Narrative Breakdown": "叙事崩塌",
        },
      },
      en: {
        title: "Theme Discovery Dashboard",
        updated: (dt) => `Updated ${dt.toLocaleDateString("en-US",{month:"short",day:"numeric"})} ${dt.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})}`,
        macro_label: "Macro Rates",
        portfolio_link: "Paper Portfolio",
        high_conviction: "High Conviction", score_7_10: "score 7–10",
        emerging: "Emerging", score_4_6: "score 4–6",
        watch: "Watch / Fading", score_1_3: "score 1–3",
        no_themes: "No themes yet. Pipeline will run tonight.",
        none_today: "None today.",
        bullish: "Bullish", bearish: "Bearish", neutral: "Neutral",
        spread: (v) => `2Y-10Y spread ${v > 0 ? "+" : ""}${(v*100).toFixed(0)}bp`,
        risk: { rising_rates_pressure: "Rising rates, growth pressure", rates_easing: "Rates easing", rates_stable: "Rates stable", yield_curve_inverted: "Yield curve inverted" },
        stage: {
          "Early Discovery": "Early Discovery", "Acceleration": "Acceleration",
          "Momentum Expansion": "Momentum Expansion", "Crowded Euphoria": "Crowded Euphoria", "Narrative Breakdown": "Narrative Breakdown",
        },
      },
    };

    let lang = localStorage.getItem("lang") || "zh";
    const t = () => I18N[lang];

    // ── Tooltip definitions ───────────────────────────────────────────────────
    const STAGE_TIPS = {
      "Early Discovery":    { zh: "早期发现：主题刚开始浮现，报道稀少，以专业媒体为主，价格行动有限。", en: "Early Discovery: Theme just emerging; sparse specialist coverage; limited price action." },
      "Acceleration":       { zh: "加速阶段：讨论量快速增长，出现初步价格突破，主流媒体开始关注。", en: "Acceleration: Growing mentions and initial price breakouts; mainstream media beginning coverage." },
      "Momentum Expansion": { zh: "动量扩展：广泛覆盖，价格走势强劲，机构参与明显，动量扩散至相关标的。", en: "Momentum Expansion: Broad coverage, strong price action, visible institutional involvement." },
      "Crowded Euphoria":   { zh: "拥挤狂热：媒体覆盖见顶，估值偏高，散户 FOMO 明显，分析师上调评级达峰。", en: "Crowded Euphoria: Peak coverage, stretched valuations, retail FOMO, analyst upgrades peaking." },
      "Narrative Breakdown":{ zh: "叙事崩塌：负面催化剂出现，覆盖量下降，价格走弱，核心叙事受到挑战。", en: "Narrative Breakdown: Negative catalysts, declining coverage, price weakness, thesis challenged." },
    };

    const YIELD_CURVE_TIP = {
      zh: "<b>收益率曲线</b>：反映市场对未来经济与利率的预期。<br><br>📈 <b>正常（10Y &gt; 2Y）</b>：长期利率高于短期，市场预期经济健康增长，投资者要求持有长期债券的额外回报。<br><br>📉 <b>倒挂（2Y &gt; 10Y）</b>：短期利率反超长期，意味着市场预期经济放缓乃至衰退，央行将被迫降息。历史上美国每次衰退前 12–18 个月均出现倒挂，是公认的预警信号（但非必然触发衰退）。<br><br>息差越大预期越乐观；息差为负时需保持警惕。",
      en: "<b>Yield Curve</b>: reflects market expectations for growth and interest rates.<br><br>📈 <b>Normal (10Y &gt; 2Y)</b>: long-term rates exceed short-term; markets expect healthy growth and demand a premium for long-term risk.<br><br>📉 <b>Inverted (2Y &gt; 10Y)</b>: short-term rates surpass long-term; markets price in slowdown or recession, expecting the Fed to cut rates. Historically precedes U.S. recessions by 12–18 months — reliable but not infallible.<br><br>Wider spread = bullish outlook; negative spread = watch for recession signals.",
    };

    const _tip = document.createElement("div");
    _tip.style.cssText = "position:fixed;z-index:9999;max-width:300px;padding:10px 14px;background:#1f2937;border:1px solid #374151;border-radius:8px;font-size:12px;line-height:1.7;color:#d1d5db;pointer-events:none;display:none;box-shadow:0 4px 12px rgba(0,0,0,.5)";
    document.body.appendChild(_tip);

    function showTip(el, html) {
      if (!html) return;
      _tip.innerHTML = html;
      _tip.style.display = "block";
      const r = el.getBoundingClientRect();
      const tw = _tip.offsetWidth, th = _tip.offsetHeight;
      let top = r.top - th - 8;
      let left = r.left + r.width / 2 - tw / 2;
      if (top < 8) top = r.bottom + 8;
      left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
      _tip.style.top = top + "px";
      _tip.style.left = left + "px";
    }
    function hideTip() { _tip.style.display = "none"; }

    document.addEventListener("mouseover", e => {
      const stageEl = e.target.closest("[data-tip-stage]");
      if (stageEl) {
        const def = STAGE_TIPS[stageEl.dataset.tipStage];
        if (def) return showTip(stageEl, def[lang] || def.en);
      }
      const yieldEl = e.target.closest("[data-tip-yield]");
      if (yieldEl) return showTip(yieldEl, YIELD_CURVE_TIP[lang]);
      hideTip();
    });
    document.addEventListener("mouseout", e => {
      if (!e.target.closest("[data-tip-stage]") && !e.target.closest("[data-tip-yield]")) hideTip();
    });

    function applyLang() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if (t()[key]) el.textContent = t()[key];
      });
      document.getElementById("lang-toggle").textContent = lang === "zh" ? "EN" : "中";
    }

    document.getElementById("lang-toggle").addEventListener("click", () => {
      lang = lang === "zh" ? "en" : "zh";
      localStorage.setItem("lang", lang);
      window._renderAll?.();
    });

    // ── Constants ─────────────────────────────────────────────────────────────
    const STAGE_COLORS = {
      "Early Discovery":     "bg-blue-900 text-blue-300",
      "Acceleration":        "bg-emerald-900 text-emerald-300",
      "Momentum Expansion":  "bg-yellow-900 text-yellow-300",
      "Crowded Euphoria":    "bg-orange-900 text-orange-300",
      "Narrative Breakdown": "bg-red-900 text-red-300",
    };
    const RISK_COLORS = {
      rising_rates_pressure: "bg-orange-900 text-orange-300",
      yield_curve_inverted:  "bg-red-900 text-red-300",
      rates_easing:          "bg-green-900 text-green-300",
      rates_stable:          "bg-gray-800 text-gray-400",
    };

    // ── Components ────────────────────────────────────────────────────────────
    function scoreBar(score) {
      const pct = score * 10;
      const color = score >= 7 ? "bg-green-500" : score >= 4 ? "bg-yellow-500" : "bg-red-500";
      return `<div class="flex items-center gap-2">
        <div class="flex-1 bg-gray-700 rounded-full h-1.5">
          <div class="${color} h-1.5 rounded-full" style="width:${pct}%"></div>
        </div>
        <span class="text-xs font-mono text-gray-300">${score}/10</span>
      </div>`;
    }

    function deltaChip(delta) {
      if (delta == null) return "";
      if (delta > 0) return `<span class="text-xs text-green-400 font-mono">↑+${delta}</span>`;
      if (delta < 0) return `<span class="text-xs text-red-400 font-mono">↓${delta}</span>`;
      return `<span class="text-xs text-gray-500 font-mono">—</span>`;
    }

    function themeCard(theme) {
      const stageClass = STAGE_COLORS[theme.stage] || "bg-gray-800 text-gray-300";
      const dir = theme.direction;
      const dirLabel = dir === "Bullish" ? t().bullish : dir === "Bearish" ? t().bearish : t().neutral;
      const dirColor = dir === "Bullish" ? "text-green-400" : dir === "Bearish" ? "text-red-400" : "text-gray-400";
      const arrow = dir === "Bullish" ? "↑" : dir === "Bearish" ? "↓" : "→";
      const stageName = t().stage[theme.stage] || theme.stage;
      const tickers = (theme.representative_tickers || []).slice(0, 4)
        .map(tk => `<span class="px-1.5 py-0.5 bg-gray-800 rounded text-xs font-mono text-gray-300">${tk}</span>`)
        .join("");

      return `<a href="theme.html?id=${encodeURIComponent(theme.id)}"
          class="block bg-gray-900 border border-gray-800 rounded-xl p-4 hover:border-gray-600 hover:bg-gray-800 transition-all">
        <div class="flex items-start justify-between gap-2 mb-3">
          <h3 class="font-semibold text-white leading-tight">${lang === "zh" ? (theme.name_zh || theme.name) : theme.name}</h3>
          <div class="flex items-center gap-1.5 shrink-0">
            <span class="${dirColor} font-semibold">${arrow} ${dirLabel}</span>
            ${deltaChip(theme.conviction_delta)}
          </div>
        </div>
        ${scoreBar(theme.conviction_score)}
        <div class="mt-3 flex flex-wrap gap-1.5 items-center">
          <span class="text-xs px-2 py-0.5 rounded-full cursor-help ${stageClass}" data-tip-stage="${theme.stage}">${stageName}</span>
          ${tickers}
        </div>
        ${(theme.one_line_summary || theme.one_line_summary_zh)
          ? `<p class="mt-3 text-xs text-gray-400 leading-relaxed line-clamp-2">${lang === "zh" ? (theme.one_line_summary_zh || theme.one_line_summary) : theme.one_line_summary}</p>`
          : ""}
      </a>`;
    }

    function renderMacro(macro) {
      if (!macro || !macro.yields) return;
      const bar = document.getElementById("macro-bar");
      bar.classList.remove("hidden");
      bar.classList.add("flex");

      const fmt = (v) => v != null ? `${(v * 100).toFixed(2)}%` : "—";
      const chg = (v) => v != null ? `(${v >= 0 ? "+" : ""}${(v * 100).toFixed(2)}%)` : "";
      const chgColor = (v) => v > 0 ? "text-red-400" : v < 0 ? "text-green-400" : "text-gray-500";

      const y = macro.yields;
      const c = macro.changes || {};
      document.getElementById("yield-2y").innerHTML =
        `<span class="text-gray-500 text-xs mr-1">2Y</span>${fmt(y["2Y"])} <span class="${chgColor(c["2Y"])} text-xs">${chg(c["2Y"])}</span>`;
document.getElementById("yield-10y").innerHTML =
        `<span class="text-gray-500 text-xs mr-1">10Y</span>${fmt(y["10Y"])} <span class="${chgColor(c["10Y"])} text-xs">${chg(c["10Y"])}</span>`;
      document.getElementById("spread-2-10").textContent = t().spread(macro.spread_2_10 || 0);

      const riskEl = document.getElementById("risk-label");
      const rk = macro.risk_label || "rates_stable";
      riskEl.className = `text-xs px-2 py-0.5 rounded-full ${RISK_COLORS[rk] || "bg-gray-800 text-gray-400"}`;
      riskEl.textContent = t().risk[rk] || rk;
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    let _data = null;

    window._renderAll = function () {
      if (!_data) return;
      applyLang();

      const { generated_at, themes = [], macro_context } = _data;

      if (generated_at) {
        document.getElementById("last-updated").textContent = t().updated(new Date(generated_at));
      }

      if (!themes.length) {
        document.getElementById("empty-state").classList.remove("hidden");
        return;
      }

      renderMacro(macro_context);

      const high     = themes.filter(t => t.conviction_score >= 7);
      const emerging = themes.filter(t => t.conviction_score >= 4 && t.conviction_score < 7);
      const watch    = themes.filter(t => t.conviction_score < 4);
      const none = `<p class="text-gray-500 text-sm col-span-3">${t().none_today}</p>`;

      document.getElementById("grid-high").innerHTML     = high.map(themeCard).join("") || none;
      document.getElementById("grid-emerging").innerHTML = emerging.map(themeCard).join("") || none;
      document.getElementById("grid-watch").innerHTML    = watch.map(themeCard).join("") || none;

      document.getElementById("section-high").classList.toggle("hidden", !high.length);
      document.getElementById("section-emerging").classList.toggle("hidden", !emerging.length);
      document.getElementById("section-watch").classList.toggle("hidden", !watch.length);
    };

    fetch("data/latest.json")
      .then(r => r.json())
      .then(data => { _data = data; window._renderAll(); })
      .catch(console.error);
  </script>
</body>
</html>
