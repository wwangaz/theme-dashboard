<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主题详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="text-sm text-gray-400 hover:text-white transition-colors" data-i18n="back">← 返回仪表板</a>
    <button id="lang-toggle"
      class="text-xs px-3 py-1 rounded-full border border-gray-600 text-gray-300 hover:border-gray-400 hover:text-white transition-colors">
      EN
    </button>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8" id="content">
    <p class="text-gray-400" data-i18n="loading">加载中…</p>
  </main>

  <script>
    // ── i18n ──────────────────────────────────────────────────────────────────
    const I18N = {
      zh: {
        back: "← 返回仪表板", loading: "加载中…",
        not_found: "未找到该主题。",
        bullish: "看多", bearish: "看空", neutral: "中性",
        stage_confidence: "阶段置信度", conviction_label: "确信度", first_seen: "首次出现",
        signals: "条信号", days_active: "天活跃",
        bull_case: "多头逻辑", bear_case: "空头逻辑",
        drivers: "当前驱动因素", risks: "主要风险",
        outlook: "展望",
        short_term: "短期（1–4周）", mid_term: "中期（1–6月）", long_term: "长期（1–3年）",
        timeline: "时间轴", tickers: "代表标的",
        stage: {
          "Early Discovery": "早期发现", "Acceleration": "加速阶段",
          "Momentum Expansion": "动量扩展", "Crowded Euphoria": "拥挤狂热", "Narrative Breakdown": "叙事崩塌",
        },
      },
      en: {
        back: "← Dashboard", loading: "Loading…",
        not_found: "Theme not found.",
        bullish: "Bullish", bearish: "Bearish", neutral: "Neutral",
        stage_confidence: "Stage confidence", conviction_label: "Conviction", first_seen: "First seen",
        signals: "signals", days_active: "days active",
        bull_case: "Bull Case", bear_case: "Bear Case",
        drivers: "Current Drivers", risks: "Key Risks",
        outlook: "Outlook",
        short_term: "Short-term (1–4 weeks)", mid_term: "Mid-term (1–6 months)", long_term: "Long-term (1–3 years)",
        timeline: "Timeline", tickers: "Representative Tickers",
        stage: {
          "Early Discovery": "Early Discovery", "Acceleration": "Acceleration",
          "Momentum Expansion": "Momentum Expansion", "Crowded Euphoria": "Crowded Euphoria", "Narrative Breakdown": "Narrative Breakdown",
        },
      },
    };

    let lang = localStorage.getItem("lang") || "zh";
    const t = () => I18N[lang];

    // ── Tooltip definitions (static constants) ────────────────────────────────
    const TOOLTIPS = {
      conviction_score: {
        zh: "多空信号的综合强度。综合信号来源权重（财报 > 监管文件 > 新闻 > 价格）与时效性加权计算。\n10 = 压倒性多头  1 = 压倒性空头  5 = 信号持平或稀缺",
        en: "Overall strength of bull/bear signals, weighted by source quality (transcripts > filings > news > price) and recency.\n10 = overwhelming bullish  1 = overwhelming bearish  5 = mixed or sparse",
      },
      stage_confidence: {
        zh: "AI 对当前阶段判断的把握程度。低于 5 表示信号模糊，可能处于阶段转换期，请对阶段标签打折扣。",
        en: "How certain the AI is about the stage classification. Below 5 means ambiguous signals, possibly a stage transition — treat the label with skepticism.",
      },
      stage: {
        "Early Discovery": {
          zh: "早期发现：主题刚开始浮现，报道稀少，以专业媒体为主，价格行动有限。",
          en: "Early Discovery: Theme just emerging; sparse coverage mostly from specialist sources; limited price action.",
        },
        "Acceleration": {
          zh: "加速阶段：讨论量快速增长，出现初步价格突破，主流媒体开始关注。",
          en: "Acceleration: Growing mentions and initial price breakouts; mainstream media beginning coverage.",
        },
        "Momentum Expansion": {
          zh: "动量扩展：广泛覆盖，价格走势强劲，机构参与明显，动量扩散至相关标的。",
          en: "Momentum Expansion: Broad coverage, strong price action, visible institutional involvement, momentum spreading.",
        },
        "Crowded Euphoria": {
          zh: "拥挤狂热：媒体覆盖见顶，估值偏高，散户 FOMO 明显，分析师上调评级达峰。",
          en: "Crowded Euphoria: Peak media coverage, stretched valuations, retail FOMO, analyst upgrades at their peak.",
        },
        "Narrative Breakdown": {
          zh: "叙事崩塌：负面催化剂出现，覆盖量下降，价格走弱，核心叙事受到挑战。",
          en: "Narrative Breakdown: Negative catalysts emerging, coverage declining, price weakness, core thesis challenged.",
        },
      },
    };

    // ── Tooltip UI ────────────────────────────────────────────────────────────
    const _tip = document.createElement("div");
    _tip.style.cssText = "position:fixed;z-index:9999;max-width:280px;padding:8px 12px;background:#1f2937;border:1px solid #374151;border-radius:8px;font-size:12px;line-height:1.6;color:#d1d5db;white-space:pre-line;pointer-events:none;display:none;box-shadow:0 4px 12px rgba(0,0,0,.5)";
    document.body.appendChild(_tip);

    function showTip(el, text) {
      if (!text) return;
      _tip.textContent = text;
      _tip.style.display = "block";
      const r = el.getBoundingClientRect();
      const tw = _tip.offsetWidth, th = _tip.offsetHeight;
      let top = r.top - th - 8;
      let left = r.left + r.width / 2 - tw / 2;
      if (top < 8) top = r.bottom + 8;
      left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
      _tip.style.top = top + "px";
      _tip.style.left = left + "px";
    }
    function hideTip() { _tip.style.display = "none"; }

    function tipAttr(text) {
      // Returns onmouseenter/leave attrs string for inline use — we use data attr instead
      return text || "";
    }

    // Wire tooltip to elements with data-tip-key / data-tip-stage attributes
    document.addEventListener("mouseover", e => {
      const el = e.target.closest("[data-tip-key],[data-tip-stage]");
      if (!el) return hideTip();
      if (el.dataset.tipKey) {
        const def = TOOLTIPS[el.dataset.tipKey];
        if (def) showTip(el, def[lang] || def.en);
      } else if (el.dataset.tipStage) {
        const def = TOOLTIPS.stage[el.dataset.tipStage];
        if (def) showTip(el, def[lang] || def.en);
      }
    });
    document.addEventListener("mouseout", e => {
      if (!e.target.closest("[data-tip-key],[data-tip-stage]")) hideTip();
    });

    function applyLang() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if (t()[key]) el.textContent = t()[key];
      });
      document.getElementById("lang-toggle").textContent = lang === "zh" ? "EN" : "中";
      document.title = window._theme ? `${window._theme.name} — Theme Dashboard` : "Theme Dashboard";
    }

    document.getElementById("lang-toggle").addEventListener("click", () => {
      lang = lang === "zh" ? "en" : "zh";
      localStorage.setItem("lang", lang);
      if (window._theme) renderTheme(window._theme);
    });

    // ── Constants ─────────────────────────────────────────────────────────────
    const STAGE_COLORS = {
      "Early Discovery":     "bg-blue-900 text-blue-300",
      "Acceleration":        "bg-emerald-900 text-emerald-300",
      "Momentum Expansion":  "bg-yellow-900 text-yellow-300",
      "Crowded Euphoria":    "bg-orange-900 text-orange-300",
      "Narrative Breakdown": "bg-red-900 text-red-300",
    };

    // ── i18n field helper ─────────────────────────────────────────────────────
    // Returns theme[field + '_zh'] when lang=zh and it exists, else theme[field]
    function tf(theme, field) {
      if (lang === "zh") return theme[field + "_zh"] || theme[field] || "";
      return theme[field] || "";
    }

    // ── Components ────────────────────────────────────────────────────────────
    function scoreBar(score) {
      const pct = score * 10;
      const color = score >= 7 ? "bg-green-500" : score >= 4 ? "bg-yellow-500" : "bg-red-500";
      return `<div class="flex items-center gap-3">
        <div class="flex-1 bg-gray-700 rounded-full h-2">
          <div class="${color} h-2 rounded-full" style="width:${pct}%"></div>
        </div>
        <span class="text-sm font-mono font-semibold">${score}/10</span>
      </div>`;
    }

    function deltaChip(delta) {
      if (delta == null) return "";
      if (delta > 0) return `<span class="ml-2 text-sm text-green-400 font-mono">↑+${delta}</span>`;
      if (delta < 0) return `<span class="ml-2 text-sm text-red-400 font-mono">↓${delta}</span>`;
      return "";
    }

    function evidenceItem(item, language) {
      const headline = (language === "zh" && item.headline_zh) ? item.headline_zh : item.headline;
      const inner = item.url
        ? `<a href="${item.url}" target="_blank" rel="noopener" class="hover:text-white underline underline-offset-2">${headline}</a>`
        : headline;
      return `<li class="text-sm text-gray-300 leading-relaxed">
        ${inner}
        ${item.source ? `<span class="ml-1 text-xs text-gray-500">${item.source}</span>` : ""}
      </li>`;
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function renderTheme(theme) {
      window._theme = theme;
      applyLang();

      const dir = theme.direction;
      const dirLabel = dir === "Bullish" ? t().bullish : dir === "Bearish" ? t().bearish : t().neutral;
      const dirColor = dir === "Bullish" ? "text-green-400" : dir === "Bearish" ? "text-red-400" : "text-gray-400";
      const arrow    = dir === "Bullish" ? "↑" : dir === "Bearish" ? "↓" : "→";
      const stageName = t().stage[theme.stage] || theme.stage;
      const stageClass = STAGE_COLORS[theme.stage] || "bg-gray-800 text-gray-300";

      const tickers = (theme.representative_tickers || [])
        .map(tk => `<span class="px-2 py-1 bg-gray-800 border border-gray-700 rounded text-sm font-mono">${tk}</span>`)
        .join("");

      const bullEv = (theme.bull_evidence || []).map(ev => evidenceItem(ev, lang)).join("");
      const bearEv = (theme.bear_evidence || []).map(ev => evidenceItem(ev, lang)).join("");
      const risks  = (lang === "zh" ? (theme.key_risks_zh || theme.key_risks) : theme.key_risks || [])
        .map(r => `<li class="text-sm text-gray-300">${r}</li>`).join("");
      const timeline = (theme.timeline || []).map(item =>
        `<div class="flex gap-4">
          <span class="text-xs text-gray-500 font-mono whitespace-nowrap pt-0.5 w-24 shrink-0">${item.date}</span>
          <p class="text-sm text-gray-300">${lang === "zh" ? (item.event_zh || item.event) : item.event}</p>
        </div>`
      ).join("");

      document.getElementById("content").innerHTML = `
        <div class="space-y-8">

          <!-- Header -->
          <div>
            <div class="flex flex-wrap items-start justify-between gap-4 mb-2">
              <h1 class="text-2xl font-bold text-white">${lang === "zh" ? (theme.name_zh || theme.name) : theme.name}</h1>
              <span class="${dirColor} text-xl font-bold">${arrow} ${dirLabel}${deltaChip(theme.conviction_delta)}</span>
            </div>
            <div class="flex flex-wrap items-center gap-3 mb-4">
              <span class="text-xs px-2.5 py-1 rounded-full cursor-help ${stageClass}" data-tip-stage="${theme.stage}">${stageName}</span>
              <span class="text-xs text-gray-400 cursor-help underline decoration-dotted underline-offset-2" data-tip-key="stage_confidence">${t().stage_confidence} ${theme.stage_confidence}/10</span>
              ${theme.first_seen ? `<span class="text-xs text-gray-500">${t().first_seen} ${theme.first_seen}</span>` : ""}
              <span class="text-xs text-gray-500">${theme.signal_count} ${t().signals}</span>
            </div>
            <div class="max-w-sm">
              <p class="text-xs text-gray-500 mb-1 cursor-help underline decoration-dotted underline-offset-2 inline-block" data-tip-key="conviction_score">${t().conviction_label}</p>
              ${scoreBar(theme.conviction_score)}
            </div>
            ${tf(theme,"conviction_basis") ? `<p class="mt-2 text-sm text-gray-400">${tf(theme,"conviction_basis")}</p>` : ""}
            ${tf(theme,"stage_reasoning") ? `<p class="mt-1 text-xs text-gray-500 italic">${tf(theme,"stage_reasoning")}</p>` : ""}
          </div>

          <!-- Bull / Bear -->
          <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
              <h2 class="text-sm font-semibold text-green-400 mb-3 uppercase tracking-wide">${t().bull_case}</h2>
              <p class="text-sm text-gray-300 leading-relaxed mb-4">${tf(theme,"bull_case") || "—"}</p>
              ${bullEv ? `<ul class="space-y-2 border-t border-gray-800 pt-3">${bullEv}</ul>` : ""}
            </div>
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
              <h2 class="text-sm font-semibold text-red-400 mb-3 uppercase tracking-wide">${t().bear_case}</h2>
              <p class="text-sm text-gray-300 leading-relaxed mb-4">${tf(theme,"bear_case") || "—"}</p>
              ${bearEv ? `<ul class="space-y-2 border-t border-gray-800 pt-3">${bearEv}</ul>` : ""}
            </div>
          </div>

          <!-- Drivers + Risks -->
          <div class="grid md:grid-cols-2 gap-6">
            ${tf(theme,"current_drivers") ? `
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
              <h2 class="text-sm font-semibold text-gray-300 mb-2 uppercase tracking-wide">${t().drivers}</h2>
              <p class="text-sm text-gray-300 leading-relaxed">${tf(theme,"current_drivers")}</p>
            </div>` : ""}
            ${risks ? `
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
              <h2 class="text-sm font-semibold text-gray-300 mb-3 uppercase tracking-wide">${t().risks}</h2>
              <ul class="space-y-1.5 list-disc list-inside">${risks}</ul>
            </div>` : ""}
          </div>

          <!-- Outlook -->
          <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
            <h2 class="text-sm font-semibold text-gray-300 mb-4 uppercase tracking-wide">${t().outlook}</h2>
            <div class="grid md:grid-cols-3 gap-6">
              <div>
                <p class="text-xs text-gray-500 mb-1">${t().short_term}</p>
                <p class="text-sm text-gray-300 leading-relaxed">${tf(theme,"short_term_outlook") || "—"}</p>
              </div>
              <div>
                <p class="text-xs text-gray-500 mb-1">${t().mid_term}</p>
                <p class="text-sm text-gray-300 leading-relaxed">${tf(theme,"mid_term_outlook") || "—"}</p>
              </div>
              <div>
                <p class="text-xs text-gray-500 mb-1">${t().long_term}</p>
                <p class="text-sm text-gray-300 leading-relaxed">${tf(theme,"long_term_outlook") || "—"}</p>
              </div>
            </div>
          </div>

          <!-- Timeline -->
          ${timeline ? `
          <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
            <h2 class="text-sm font-semibold text-gray-300 mb-4 uppercase tracking-wide">${t().timeline}</h2>
            <div class="space-y-4 border-l-2 border-gray-700 pl-5">${timeline}</div>
          </div>` : ""}

          <!-- Tickers -->
          ${tickers ? `
          <div>
            <p class="text-xs text-gray-500 mb-2 uppercase tracking-wide">${t().tickers}</p>
            <div class="flex flex-wrap gap-2">${tickers}</div>
          </div>` : ""}

        </div>`;
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    async function init() {
      const id = new URLSearchParams(location.search).get("id");
      if (!id) { document.getElementById("content").innerHTML = `<p class="text-red-400">${t().not_found}</p>`; return; }

      const data = await fetch("data/latest.json").then(r => r.json());
      const theme = (data.themes || []).find(th => th.id === id);
      if (!theme) { document.getElementById("content").innerHTML = `<p class="text-red-400">${t().not_found}</p>`; return; }

      renderTheme(theme);
    }

    init().catch(console.error);
  </script>
</body>
</html>
